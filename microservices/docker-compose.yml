services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d orders_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  order-service:
    build: ./services/order-service
    environment:
      DATABASE_URL: postgresql+psycopg://app:app_password@postgres:5432/orders_db
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks:
      - backend

  payment-service:
    build: ./services/payment-service
    environment:
      SIMULATE_PAYMENT_FAILURE: ${SIMULATE_PAYMENT_FAILURE:-false}
    ports:
      - "8002:8002"
    networks:
      - backend

  api-gateway:
    build: ./services/api-gateway
    environment:
      ORDER_SERVICE_URL: http://order-service:8001
      PAYMENT_SERVICE_URL: http://payment-service:8002
    depends_on:
      - order-service
      - payment-service
    ports:
      - "8000:8000"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge