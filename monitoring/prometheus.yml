global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8002"]
