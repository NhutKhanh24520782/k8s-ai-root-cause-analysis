apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: microservices
  labels:
    app: api-gateway

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api-gateway

  template:
    metadata:
      labels:
        app: api-gateway

    spec:
      containers:
        - name: api-gateway
          # Image is set at deploy time by the CI/CD pipeline (cicd.yml → deploy job).
          # Placeholder keeps the manifest valid for 'kubectl apply' without hardcoding
          # the AWS account ID or region.
          image: REGISTRY/api-gateway:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: PORT
              value: "8000"

            - name: ORDER_SERVICE_URL
              value: "http://order-service:8001"

            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:8002"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi