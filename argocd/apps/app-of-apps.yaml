apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-rca-root-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: ai-rca
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/NhutKhanh24520782/k8s-ai-root-cause-analysis.git
    targetRevision: main
    path: argocd/apps
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

