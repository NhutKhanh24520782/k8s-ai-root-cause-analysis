name: CI — Build & Push to ECR (Tag Release)

on:
  push:
   branches:
      - main
      - feat/gitops
   tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. VALIDATE — Syntax gate
  # ─────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Python source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile microservice source
        run: python -m compileall -q microservices/services

      # - name: Compile RCA API source
      #   run: python -m compileall -q rca-api/app || true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2a. BUILD ONLY (Pull Request) — verify Dockerfiles without pushing to ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build-pr:
    name: "Build check: ${{ matrix.service }}"
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: microservices/services/api-gateway
            dockerfile: microservices/services/api-gateway/Dockerfile
          - service: order-service
            context: microservices/services/order-service
            dockerfile: microservices/services/order-service/Dockerfile
          - service: payment-service
            context: microservices/services/payment-service
            dockerfile: microservices/services/payment-service/Dockerfile
          # - service: rca-api
          #   context: .
          #   dockerfile: rca-api/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (dry-run, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: local/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # 2b. BUILD & PUSH (Tag Release) — Publish semver tag to ECR
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "Build & push: ${{ matrix.service }}"
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      registry: ${{ steps.login-ecr.outputs.registry }}
      image_tag: ${{ steps.extract-tag.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            context: microservices/services/api-gateway
            dockerfile: microservices/services/api-gateway/Dockerfile
          - service: order-service
            context: microservices/services/order-service
            dockerfile: microservices/services/order-service/Dockerfile
          - service: payment-service
            context: microservices/services/payment-service
            dockerfile: microservices/services/payment-service/Dockerfile
          # - service: rca-api
          #   context: .
          #   dockerfile: rca-api/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Extract semver tag
        id: extract-tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Processing Tag Release: ${TAG}"

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '{sub, aud, repository, ref, environment}'
          echo "ROLE_ARN=${{ secrets.AWS_ROLE_ARN }}" | sed 's/[0-9]\{12\}/<acct>/'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.service }}
          tags: |
            type=semver,pattern=v{{version}}

      - name: Build and push to ECR
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          TAG="${{ steps.extract-tag.outputs.tag }}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### ✅ Image Pushed to ECR
          | Service | Tag | Registry | Digest |
          |---|---|---|---|
          | \`${{ matrix.service }}\` | \`${TAG}\`, \`latest\` | \`${REGISTRY}\` | \`${{ steps.push.outputs.digest }}\` |
          EOF

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. GITHUB RELEASE — Create GitHub Release entry
  # ─────────────────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build-and-push
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract tag
        id: tag
        run: echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "Release ${{ steps.tag.outputs.value }}"
          generate_release_notes: true
          body: |
            ## 🐳 Docker Images in ECR (`${{ steps.tag.outputs.value }}`)

            | Service | Image URI |
            |---------|-----------|
            | api-gateway | `${{ steps.login-ecr.outputs.registry }}/api-gateway:${{ steps.tag.outputs.value }}` |
            | order-service | `${{ steps.login-ecr.outputs.registry }}/order-service:${{ steps.tag.outputs.value }}` |
            | payment-service | `${{ steps.login-ecr.outputs.registry }}/payment-service:${{ steps.tag.outputs.value }}` |
            # | rca-api | `${{ steps.login-ecr.outputs.registry }}/rca-api:${{ steps.tag.outputs.value }}` |

            ---
            *To deploy this release to EKS, trigger the **[CD — Approve & Promote](${{ github.server_url }}/${{ github.repository }}/actions/workflows/cd-approve.yml)** workflow.*

