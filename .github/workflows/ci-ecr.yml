name: CI — Build & Push to ECR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least-privilege defaults; individual jobs escalate only what they need.
permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. VALIDATE — fast syntax gate, no AWS access required
  # ─────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Python source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Compile microservice source
        run: python -m compileall -q microservices/services

      - name: Compile RCA API source
        run: python -m compileall -q rca-api

  # ─────────────────────────────────────────────────────────────────────────
  # 2a. BUILD ONLY (pull request) — verify Dockerfiles; do not push
  # ─────────────────────────────────────────────────────────────────────────
  build-pull-request:
    name: "Build ${{ matrix.image }} (PR check)"
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: microservices/services/api-gateway
          - image: order-service
            context: microservices/services/order-service
          - image: payment-service
            context: microservices/services/payment-service
          - image: rca-api
            context: rca-api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: local/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # 2b. BUILD & PUSH (push to main) — authenticate to ECR and publish images
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: "Build & push ${{ matrix.image }}"
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for OIDC → AWS role assumption (no long-lived keys)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-gateway
            context: microservices/services/api-gateway
          - image: order-service
            context: microservices/services/order-service
          - image: payment-service
            context: microservices/services/payment-service
          - image: rca-api
            context: rca-api
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Assume the GitHub Actions IAM role via OIDC — no long-lived AWS keys
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Tags: sha-<full-sha>  +  latest (main branch only)
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        run: |
          echo "### ✅ Image pushed to ECR" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ matrix.image }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | \`${{ steps.login-ecr.outputs.registry }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | \`${{ steps.meta.outputs.tags }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
